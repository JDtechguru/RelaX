<!doctype html>
<html lang="en-GB" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e8f1e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1a14" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RelaX">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>RelaX</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--text:#151922;--muted:#667085;--line:#e4e7ec;--accent:#7c3aed;--accent-ink:#ffffff;--weekend:#eceff4;--holiday:#fde8e7;--holiday-ink:#b42318;--danger:#d92d20;--ok:#12b76a;--warn:#f79009;--shadow:0 1px 3px rgba(16,24,40,.08);--heat:124,58,237}
@media (prefers-color-scheme: dark){:root{--bg:#0e1116;--card:#181c24;--text:#e9ebf0;--muted:#98a2b3;--line:#2b313c;--accent:#a78bfa;--accent-ink:#120c24;--weekend:#13161c;--holiday:#3b1f20;--holiday-ink:#ff9b91;--shadow:none;--heat:167,139,250}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0}h2{font-size:19px;margin:14px 0 8px}h3{font-size:16px;margin:16px 0 8px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.err{color:var(--danger);min-height:1em;margin:6px 0;font-size:13.5px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 6px;display:flex;align-items:center;gap:8px}
.tt{flex:1;min-width:0}.tn{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ss.offline,.ss.error{color:var(--warn)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--accent);color:var(--accent-ink)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn svg{width:20px;height:20px}
body.busy .iconbtn[data-act=refresh] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toolbar{display:flex;align-items:center;gap:8px;padding:4px 12px}
.navbtn{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;padding:0}
.ptitle{flex:1;text-align:center;font-weight:700;font-size:17px}
.todaybtn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:38px;padding:0 12px;font-weight:600}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;margin:8px 12px 4px}
.seg button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:8px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:var(--shadow);color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-size:13.5px}
.chipbtn[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
select,input,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:42px}
textarea{min-height:90px}
input[type=color]{padding:3px;height:42px}
.selchip{width:auto;border-radius:999px;padding:6px 10px;min-height:0;font-size:13.5px;flex:none}
.fld{display:block;margin:10px 0;font-size:13.5px;color:var(--muted)}
.fld>input,.fld>select,.fld>textarea{margin-top:4px}
.fld .hint{display:block;font-size:12px;margin-top:4px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--text)}
.checks input{width:auto;min-height:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 16px;min-height:44px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.textdanger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn.full{width:100%}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.btns .grow{margin-inline-end:auto}
body.busy .btn[type=submit],body.busy .needsnet{opacity:.5;pointer-events:none}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:16px}
.wrap{padding:0 12px}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:6px 8px}
.dow{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0;font-weight:600}
.mcell{min-height:66px;border:0;border-radius:10px;background:var(--card);padding:3px;text-align:start;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.mcell.out{opacity:.35}
.mcell.we{background:var(--weekend);box-shadow:none}
.mcell.hol{background:var(--holiday)}
.dn{font-size:12.5px;font-weight:600;min-width:21px;height:21px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:999px}
.today .dn{background:var(--accent);color:var(--accent-ink)}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:1px}
.cnt{font-size:10px;font-weight:700;background:var(--text);color:var(--bg);border-radius:999px;padding:1px 4px;line-height:1.35;flex:none}
.inis{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.ini{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:8.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;letter-spacing:-.2px}
.ini.half{background:linear-gradient(135deg,var(--c) 50%,transparent 50%);color:var(--text);border:1.5px solid var(--c)}
.more{font-size:10px;color:var(--muted);align-self:center}
.hname{font-size:9px;color:var(--holiday-ink);line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:auto}
@media (min-width:600px){.mcell{min-height:84px}.ini{width:22px;height:22px;font-size:10px}}
/* week */
.wlist{padding:6px 12px;display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;gap:10px;padding:10px;border:0;border-radius:12px;background:var(--card);text-align:start;box-shadow:var(--shadow);width:100%;align-items:flex-start}
.wrow.we{background:var(--weekend);box-shadow:none}.wrow.hol{background:var(--holiday)}
.wdate{width:46px;flex:none;text-align:center}
.wdate .d1{font-size:11.5px;color:var(--muted);font-weight:600}.wdate .d2{font-size:20px;font-weight:700}
.today .wdate .d2{color:var(--accent)}
.wbody{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:36px}
.wcnt{flex:none;font-weight:700;font-size:13px;background:var(--text);color:var(--bg);border-radius:999px;padding:2px 9px;align-self:center}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:var(--card);background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid var(--c);font-size:13px}
.free{color:var(--muted);font-size:13px}
.holtag{color:var(--holiday-ink);font-weight:600;font-size:13px}
/* year */
.ygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:6px 12px}
@media (min-width:560px){.ygrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mini{padding:8px}
.mini .mt{border:0;background:none;font-weight:700;padding:2px 0 6px;font-size:14px;color:var(--accent)}
.mini .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mini .dw{font-size:8.5px;text-align:center;color:var(--muted)}
.yc{aspect-ratio:1;border:0;border-radius:4px;font-size:9px;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;line-height:1}
.yc.we{color:var(--muted);background:var(--weekend)}
.yc.hol{background:var(--holiday);color:var(--holiday-ink);font-weight:700}
.yc.h{background:rgba(var(--heat),var(--a));color:#fff;font-weight:700}
.yc.today{outline:2px solid var(--accent);outline-offset:-1px}
.yc.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px;font-size:12px;color:var(--muted)}
.legend .lg{display:inline-flex;gap:5px;align-items:center}
.lgbox{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--b)}
.heatbar{display:inline-flex;gap:2px}.heatbar i{width:12px;height:12px;border-radius:3px;background:rgba(var(--heat),var(--a))}
/* nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.bnav .in{display:flex;max-width:760px;margin:0 auto}
.bnav button{flex:1;border:0;background:none;padding:9px 0 7px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600}
.bnav svg{width:22px;height:22px}
.bnav button[aria-current=page]{color:var(--accent)}
.fab{position:fixed;inset-inline-end:max(16px,calc(50% - 364px));bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:32px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6}
/* sheets */
#modal-root,#dialog-root{position:fixed;inset:0;display:none;z-index:20}
#dialog-root{z-index:30}
#modal-root.open,#dialog-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:760px;max-height:90vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet h3{margin-top:4px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.dialog{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);margin:0 auto;max-width:420px;background:var(--card);border-radius:16px;padding:18px}
.dialog p{margin:0 0 8px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.lrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .main{flex:1;min-width:0}
.lrow .nm{font-weight:600}
.lrow .sub{font-size:12.5px;color:var(--muted)}
.big{font-size:26px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700}
td.n,th.n{text-align:end}
tfoot td{font-weight:700;border-bottom:0}
.sec{margin:12px 0;padding:4px 14px}
.sec>h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:last-child{text-align:end;color:var(--muted);word-break:break-all}
.tagsm{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);margin-inline-start:6px}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.screen .card{width:100%;max-width:420px}
.logo{width:84px;height:84px;margin:0 auto 4px;display:block}
.screen h1{text-align:center}.screen .tag-line{text-align:center;margin-top:-4px}
.blogo{width:34px;height:34px;flex:none}
.gx{background:linear-gradient(135deg,#ff3cac 0%,#8b5cf6 50%,#22d3ee 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{font-weight:800;font-size:19px;letter-spacing:-.2px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;text-align:center}
#toast.show{opacity:.95}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
.note{font-size:12.5px;color:var(--muted);padding:2px 14px}
.yearchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
:root{--g1:#e8f1e4;--g2:#f3efe2;--g3:#e2eeea;--b1:rgba(150,190,140,.45);--b2:rgba(230,210,160,.38);--b3:rgba(140,195,180,.35);
 --accent:#5b8c5a;--accent2:#3f8f86;--accent-ink:#fff;--grad:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
 --bg:transparent;--card:rgba(255,255,255,.66);--solid:#f8faf5;--text:#26352a;--muted:#687a6c;--line:rgba(255,255,255,.78);--hair:rgba(38,53,42,.08);
 --weekend:rgba(255,255,255,.28);--holiday:rgba(255,214,200,.65);--holiday-ink:#b05a3c;--heat:91,140,90;--danger:#c2412d;--ok:#3f8f5a;--warn:#c98a1b;
 --shadow:0 4px 16px rgba(60,90,60,.08),0 1px 2px rgba(60,90,60,.06);--glow:0 8px 22px rgba(91,140,90,.33)}
@media (prefers-color-scheme: dark){:root{--g1:#0e1a14;--g2:#14201c;--g3:#1b1f17;--b1:rgba(91,140,90,.30);--b2:rgba(63,143,134,.24);--b3:rgba(190,170,110,.14);
 --accent:#8fc48e;--accent2:#5fbfb1;--accent-ink:#0b1a10;--card:rgba(255,255,255,.07);--solid:#16241d;--text:#e4eee6;--muted:#93a89a;--line:rgba(255,255,255,.10);--hair:rgba(255,255,255,.08);
 --weekend:rgba(255,255,255,.03);--holiday:rgba(255,140,110,.16);--holiday-ink:#ffab95;--heat:143,196,142;--danger:#ff8a75;--shadow:none;--glow:0 8px 24px rgba(143,196,142,.28)}}
html{background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%) fixed;min-height:100%}
html,body{background-color:transparent}
body{background:transparent}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
 background:radial-gradient(38% 30% at 15% 20%,var(--b1),transparent 70%),radial-gradient(40% 32% at 90% 35%,var(--b2),transparent 70%),radial-gradient(45% 35% at 40% 95%,var(--b3),transparent 70%);
 filter:blur(10px);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.06)}}
/* glass surfaces */
.card,.mcell,.wrow,.iconbtn,.navbtn,.todaybtn,.chipbtn,.btn.ghost,select,input,textarea,.checks label{background:var(--card);border-color:var(--line);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.card{border-radius:18px;box-shadow:var(--shadow)}
.mcell{border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.mcell.we,.wrow.we{background:var(--weekend);border-color:transparent}
.mcell.hol,.wrow.hol{background:var(--holiday)}
.topbar{background:transparent;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.iconbtn,.navbtn,.todaybtn{border-radius:14px;box-shadow:var(--shadow)}
.seg{background:rgba(255,255,255,.35);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (prefers-color-scheme: dark){.seg{background:rgba(255,255,255,.05)}}
.seg button{border-radius:11px;transition:color .25s,background .25s,box-shadow .25s,transform .15s}
.seg button[aria-pressed=true]{background:var(--grad);color:var(--accent-ink);box-shadow:var(--glow)}
.btn{background:var(--grad);border-radius:14px;box-shadow:var(--glow);background-size:160% 160%;transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background-position .5s}
.btn:hover{background-position:100% 0}
.btn.ghost{box-shadow:var(--shadow);color:var(--text)}
.today .dn{background:var(--grad);box-shadow:var(--glow)}
.today .wdate .d2{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cnt,.wcnt{background:var(--grad);color:#fff}
.pill{background:var(--grad)}
.ini{box-shadow:0 2px 5px rgba(0,0,0,.12);animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
.mini .mt{color:var(--accent)}
.yc.today{outline-color:var(--accent)}
.bnav{background:var(--card);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:22px;box-shadow:0 10px 30px rgba(30,70,90,.15);border:1px solid var(--line);padding-bottom:0}
.bnav button{position:relative;transition:color .25s}
.bnav button[aria-current=page]{color:var(--accent)}
.bnav button[aria-current=page]::before{content:"";position:absolute;top:5px;width:46px;height:30px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);z-index:-1;animation:pillin .35s cubic-bezier(.3,1.5,.5,1)}
.bnav button[aria-current=page] svg{animation:bounce .45s cubic-bezier(.3,1.6,.5,1)}
.fab{background:var(--grad);box-shadow:var(--glow),0 0 0 6px color-mix(in srgb,var(--accent) 14%,transparent);bottom:calc(96px + env(safe-area-inset-bottom));transition:transform .25s cubic-bezier(.3,1.6,.5,1);animation:breathe 3.2s ease-in-out infinite}
.fab:active{transform:rotate(90deg) scale(.9)}
.backdrop{background:rgba(20,40,55,.30);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s ease-out}
.sheet,.dialog{background:var(--solid);background:color-mix(in srgb,var(--solid) 92%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:26px 26px 0 0;animation:sheetup .42s cubic-bezier(.2,1.2,.35,1)}
.dialog{border-radius:22px}
.grab{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.tag{border-width:0;background:color-mix(in srgb,var(--c) 20%,rgba(255,255,255,.6));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
#toast{background:var(--grad);color:#fff;border-radius:16px;box-shadow:var(--glow);transform:translate(-50%,12px);transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.gx{background:linear-gradient(135deg,#ff6fb5 0%,#8b7cf6 50%,#3fd0e0 100%);-webkit-background-clip:text;background-clip:text}
.logo{animation:float 4s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(80,120,200,.25))}
/* view entrance */
.mgrid .mcell{animation:rise .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*12ms)}
.wlist .wrow,.ygrid .mini,.sec,.card{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
/* press feedback */
button,.btn,.mcell,.wrow,.chipbtn,.yc{transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
button:active,.mcell:active,.wrow:active{transform:scale(.94)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:color-mix(in srgb,var(--accent) 35%,transparent);transform:scale(0);animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes bounce{40%{transform:translateY(-4px) scale(1.12)}}
@keyframes pillin{from{transform:scale(.5);opacity:0}}
@keyframes sheetup{from{transform:translateY(60%);opacity:.3}}
@keyframes fade{from{opacity:0}}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes breathe{50%{box-shadow:var(--glow),0 0 0 11px color-mix(in srgb,var(--accent) 8%,transparent)}}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important;transition:none!important}}

/* about */
.ahero{text-align:center;padding:22px 16px 18px;margin:8px 12px}
.ahero .logo{width:92px;height:92px}
.ahero .an{font-size:30px;font-weight:800;letter-spacing:-.4px;margin:4px 0 0}
.ahero .ver{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.maker{display:flex;gap:14px;align-items:center;margin:10px 12px;padding:16px}
.mav{width:56px;height:56px;border-radius:50%;flex:none;background:var(--grad);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--glow)}
.maker .lb{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.maker .mn{font-size:19px;font-weight:800}
.maker .md{color:var(--muted);font-size:14px}
.howto{margin:10px 12px;padding:4px 0}
.howto>h3{margin:12px 16px 6px}
.howto details{border-top:1px solid var(--hair)}
.howto summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;font-weight:700}
.howto summary::-webkit-details-marker{display:none}
.howto summary .hi{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 15%,transparent);font-size:17px}
.howto summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.howto details[open] summary::after{transform:rotate(-135deg)}
.howto .hb{padding:0 16px 14px 60px;font-size:14px;color:var(--text);animation:rise .35s cubic-bezier(.2,.9,.3,1)}
.howto .hb ul,.howto .hb ol{margin:0;padding-inline-start:18px}.howto .hb li{margin:5px 0}
.howto .hb b{color:var(--accent)}
.afoot{text-align:center;font-size:12.5px;color:var(--muted);padding:6px 20px 18px}

</style>
</head>

/* ---------------- crypto ---------------- */
const keyCache = new Map();
async function getKey(pass, saltB64, iter) {
  const id = pass + '|' + saltB64 + '|' + iter;
  if (keyCache.has(id)) return keyCache.get(id);
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64d(saltB64), iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  keyCache.set(id, key); return key;
}
async function encryptData(obj, pass, saltB64, iter) {
  iter = iter || KDF_ITER;
  saltB64 = saltB64 || b64e(crypto.getRandomValues(new Uint8Array(16)));
  const key = await getKey(pass, saltB64, iter);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))));
  return {format: 'team-leave-tracker', v: 1, kdf: 'PBKDF2-SHA256', iter, salt: saltB64, iv: b64e(iv), ct: b64e(ct)};
}
async function decryptData(env, pass) {
  if (!env || env.format !== 'team-leave-tracker') throw errCode('The data file is not a leave tracker file.', 'format');
  const key = await getKey(pass, env.salt, env.iter || KDF_ITER);
  let pt;
  try { pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64d(env.iv)}, key, b64d(env.ct)); }
  catch (e) { throw errCode('That passcode is not correct.', 'badpass'); }
  return normalize(JSON.parse(td.decode(pt)));
}

function normalize(d) {

  d.settings = Object.assign({weekStart: 1, weekend: [0, 6]}, d.settings || {});
  ['members', 'types', 'holidays', 'entries'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  d.holidays.sort((a, b) => a.date < b.date ? -1 : 1);
  return d;
}
function starterData(teamName, people) {

  return normalize({

}
function isWeekend(k) { return state.data.settings.weekend.includes(pd(k).getDay()); }
function isWorking(k) { return !isWeekend(k) && !idx.hol.has(k); }
function rebuildIndex() {
  const d = state.data, f = state.filters;
  idx = {days: new Map(), hol: new Map(d.holidays.map(h => [h.date, h.name])), m: new Map(d.members.map(m => [m.id, m])), t: new Map(d.types.map(t => [t.id, t]))};
  if (f.member !== 'all' && !idx.m.has(f.member)) f.member = 'all';
  f.hidden = f.hidden.filter(id => idx.t.has(id));
  for (const e of d.entries) {
    if (f.member !== 'all' && e.memberId !== f.member) continue;
    if (f.hidden.includes(e.typeId)) continue;
    if (!idx.m.has(e.memberId) || !isDate(e.start) || !isDate(e.end)) continue;
    let cur = pd(e.start); const end = pd(e.end);
    for (let i = 0; i < 400 && cur <= end; i++, cur = addD(cur, 1)) {
      const k = ymd(cur); if (!isWorking(k)) continue;
      if (!idx.days.has(k)) idx.days.set(k, []);
      idx.days.get(k).push(e);
    }
  }
}
const dayList = k => idx.days.get(k) || [];
function weightOf(e) { const t = typeById(e.typeId); return t ? Number(t.weight) : 1; }
function perMember(k) { const per = new Map(); for (const e of dayList(k)) per.set(e.memberId, Math.min(1, (per.get(e.memberId) || 0) + weightOf(e))); return per; }
function dayCount(k) { let s = 0; perMember(k).forEach(v => s += v); return s; }
function peopleOn(k) { return new Set(dayList(k).map(e => e.memberId)).size; }
function workingDays(a, b) { let n = 0, cur = pd(a); const end = pd(b); for (let i = 0; i < 800 && cur <= end; i++, cur = addD(cur, 1)) if (isWorking(ymd(cur))) n++; return n; }
function typeLabel(e) { const t = typeById(e.typeId); return (t ? t.name : 'Leave') + (e.part ? ' (' + e.part + ')' : ''); }

/* ---------------- GitHub storage ---------------- */
function detectRepo() {
  const saved = localStorage.getItem(K.repo);
  if (saved && saved.includes('/')) { const [owner, repo] = saved.split('/'); return {owner, repo}; }
  const h = location.hostname;
  if (h.endsWith('.github.io')) {
    const owner = h.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return {owner, repo: (seg && !seg.includes('.')) ? seg : h};
  }
  return null;
}
const repoLabel = () => state.repo ? state.repo.owner + '/' + state.repo.repo : '';
const apiBase = () => 'https://api.github.com/repos/' + encodeURIComponent(state.repo.owner) + '/' + encodeURIComponent(state.repo.repo);
function ghHeaders(tok) { const h = {'Accept': 'application/vnd.github+json'}; if (tok) h.Authorization = 'Bearer ' + tok; return h; }

async function fetchRemote() {
  const tok = state.token;
  let apiStatus = 0;
  try {
    const r = await fetch(apiBase() + '/contents/' + DATA_FILE, {headers: ghHeaders(tok), cache: 'no-store'});
    apiStatus = r.status;
    if (r.status === 200) {
      const j = await r.json();
      let text;
      if (j.content) text = td.decode(b64d(j.content));
      else { const r2 = await fetch(j.download_url + '?t=' + Date.now(), {cache: 'no-store'}); text = await r2.text(); }
      return {env: JSON.parse(text), sha: j.sha};
    }
    if (r.status === 404) return {notFound: true};
    if (r.status === 401 && tok) throw errCode('The admin edit key on this phone is invalid or has expired. Replace it in Settings.', 'badtoken');
  } catch (e) { if (e.code === 'badtoken') throw e; }
  // Fallbacks (e.g. GitHub's hourly limit for viewers was reached)
  let nf = false;
  const urls = ['https://raw.githubusercontent.com/' + state.repo.owner + '/' + state.repo.repo + '/HEAD/' + DATA_FILE + '?t=' + Date.now(), './' + DATA_FILE + '?t=' + Date.now()];
  for (const u of urls) {
    try { const r = await fetch(u, {cache: 'no-store'}); if (r.ok) return {env: await r.json(), sha: null}; if (r.status === 404) nf = true; } catch (e) {}
  }
  if (nf && apiStatus !== 403 && apiStatus !== 429) return {notFound: true};
  throw errCode("Can't reach GitHub right now. Check your internet connection.", 'offline');
}
async function putRemote(env, sha, msg) {
  const body = {message: msg || COMMIT_MSG, content: b64e(te.encode(JSON.stringify(env)))};
  if (sha) body.sha = sha;
  let r;
  try { r = await fetch(apiBase() + '/contents/' + DATA_FILE, {method: 'PUT', headers: Object.assign(ghHeaders(state.token), {'Content-Type': 'application/json'}), body: JSON.stringify(body)}); }
  catch (e) { throw errCode("Can't reach GitHub right now. Your change was not saved.", 'offline'); }
  if (r.status === 200 || r.status === 201) { const j = await r.json(); return j.content.sha; }
  if (r.status === 409 || r.status === 422) throw errCode('conflict', 'conflict');
  if (r.status === 401) throw errCode('The admin edit key on this phone is invalid or has expired. Replace it in Settings.', 'badtoken');
  if (r.status === 403 || r.status === 404) throw errCode('This edit key is not allowed to save here. It needs "Contents: Read and write" access to ' + repoLabel() + '.', 'noaccess');
  throw errCode('GitHub returned an error (' + r.status + '). Your change was not saved.', 'http');
}
function applyData(d, env, sha) {
  state.data = d; state.sha = sha;
  try { localStorage.setItem(K.cache, JSON.stringify(env)); } catch (e) {}
  state.sync = {status: 'ok', at: Date.now(), msg: ''};
  rebuildIndex(); render();
}
/* Re-reads the latest file, applies the change, saves; retries if someone else saved first. */
async function commit(mutate, opts) {
  opts = opts || {};
  if (!isAdmin()) { toast('Only admins can make changes. Add the admin edit key in Settings.'); return false; }
  if (state.busy) { toast('Please wait – still saving…'); return false; }
  setBusy(true); toast('Saving…', 15000);
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const rem = await fetchRemote();
      if (rem.notFound) throw new Error('The shared data file was not found on GitHub.');
      const data = await decryptData(rem.env, state.pass);
      if (mutate(data) === false) { toast(''); return false; }
      data.rev = (data.rev || 0) + 1; data.updated = new Date().toISOString();
      const pass = opts.newPass || state.pass;
      const env = opts.newPass ? await encryptData(data, pass) : await encryptData(data, pass, rem.env.salt, rem.env.iter || KDF_ITER);
      try {
        const sha = await putRemote(env, rem.sha);
        if (opts.newPass) { state.pass = pass; localStorage.setItem(K.pass, pass); }
        applyData(data, env, sha); toast(opts.done || 'Saved'); return true;
      } catch (e) { if (e.code === 'conflict') { await sleep(800 * (attempt + 1)); continue; } throw e; }
    }
    throw new Error('Someone else is saving at the same moment. Please try again.');
  } catch (e) { handleErr(e); return false; }
  finally { setBusy(false); }
}
function handleErr(e) {
  if (e && e.code === 'badpass') { forgetPass(); renderLock('The team passcode has changed. Enter the new passcode.'); return; }
  toast((e && e.message) || 'Something went wrong.', 5000);
}
function forgetPass() { localStorage.removeItem(K.pass); state.pass = ''; state.data = null; closeSheet(); }
async function sync(manual) {
  if (!state.repo || !state.pass) return;
  state.sync.status = 'syncing'; updateSyncLabel(); setBusy(true);
  try {
    const rem = await fetchRemote();
    if (rem.notFound) { if (!state.data) return renderSetup(); state.sync = {status: 'error', at: state.sync.at, msg: 'Shared data file not found'}; updateSyncLabel(); return; }
    const d = await decryptData(rem.env, state.pass);
    applyData(d, rem.env, rem.sha);
    if (manual) toast('Up to date');
  } catch (e) {
    if (e.code === 'badpass') return handleErr(e);
    state.sync.status = 'offline'; state.sync.msg = e.message;
    if (!state.data) renderOffline(); else { updateSyncLabel(); if (manual) toast(e.message, 4000); }
  } finally { setBusy(false); }
}

/* ---------------- UI helpers ---------------- */
let toastTimer = null;
function toast(msg, ms) {
  const t = $('#toast'); clearTimeout(toastTimer);
  if (!msg) { t.classList.remove('show'); return; }
  t.textContent = msg; t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
}
function setBusy(b) { state.busy = b; document.body.classList.toggle('busy', b); }
function relTime(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago';
  const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ', ' + d.getDate() + ' ' + MON3[d.getMonth()];
}
function syncText() {
  const s = state.sync;
  if (s.status === 'syncing') return 'Checking for updates…';
  if (s.status === 'offline') return 'Offline – showing saved copy';
  if (s.status === 'error') return esc(s.msg);
  return 'Updated ' + relTime(s.at);
}
function updateSyncLabel() { const el = $('#syncl'); if (el) { el.parentNode.className = 'ss ' + state.sync.status; el.innerHTML = syncText(); } }
function openSheet(html, onMount) {
  const r = $('#modal-root');
  r.innerHTML = '<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + html + '</div>';

  if (onMount) onMount(r.querySelector('.sheet'));
}
function closeSheet() {
  const r = $('#modal-root'); r.classList.remove('open'); r.innerHTML = '';
  const cb = state.onSheetClose; state.onSheetClose = null; if (cb) cb();
}
function ask(msg, ok, danger, cancel) {
  return new Promise(res => {
    const r = $('#dialog-root');
    r.innerHTML = '<div class="backdrop"></div><div class="dialog" role="alertdialog"><p>' + msg + '</p><div class="btns"><button class="btn ghost" data-r="0">' + esc(cancel || 'Cancel') + '</button><button class="btn ' + (danger ? 'danger' : '') + '" data-r="1">' + esc(ok || 'OK') + '</button></div></div>';
    r.classList.add('open');
    r.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { r.classList.remove('open'); r.innerHTML = ''; res(b.dataset.r === '1'); }));
  });
}
function fieldHtml(f) {
  const v = f.value == null ? '' : f.value;
  const lab = esc(f.label);
  const hint = f.hint ? '<span class="hint">' + f.hint + '</span>' : '';
  if (f.type === 'select') return '<label class="fld">' + lab + '<select name="' + f.key + '">' + f.options.map(o => '<option value="' + esc(o.v) + '"' + (String(o.v) === String(v) ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') + '</select>' + hint + '</label>';
  if (f.type === 'textarea') return '<label class="fld">' + lab + '<textarea name="' + f.key + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>' + hint + '</label>';
  if (f.type === 'checks') return '<div class="fld">' + lab + '<div class="checks">' + f.options.map(o => '<label><input type="checkbox" name="' + f.key + '" value="' + esc(o.v) + '"' + (v.map(String).includes(String(o.v)) ? ' checked' : '') + '>' + esc(o.l) + '</label>').join('') + '</div>' + hint + '</div>';
  const extra = f.type === 'password' ? ' autocomplete="new-password" autocapitalize="off" spellcheck="false"' : (f.type === 'text' ? ' autocapitalize="' + (f.nocap ? 'off' : 'sentences') + '"' : '');
  return '<label class="fld">' + lab + '<input type="' + (f.type || 'text') + '" name="' + f.key + '" value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '"' + extra + '>' + hint + '</label>';
}
function readForm(form, fields) {
  const out = {};
  fields.forEach(f => {
    if (f.type === 'checks') out[f.key] = Array.from(form.querySelectorAll('input[name="' + f.key + '"]:checked')).map(i => i.value);
    else { const el = form.elements[f.key]; out[f.key] = el ? (f.type === 'password' ? el.value : el.value.trim()) : ''; }
  });
  return out;
}
/* Generic form sheet. validate(v) may return an error string; save(v) may be async and return false to keep it open. */
function formModal(title, fields, opt) {
  opt = opt || {};
  return new Promise(res => {
    const html = '<h3>' + esc(title) + '</h3>' + (opt.note ? '<p class="muted small">' + opt.note + '</p>' : '') +
      '<form id="fm" novalidate>' + fields.map(fieldHtml).join('') + '<p class="err" id="fm-err"></p><div class="btns"><button type="button" class="btn ghost" data-x="cancel">Cancel</button><button type="submit" class="btn ' + (opt.danger ? 'danger' : '') + '">' + esc(opt.ok || 'Save') + '</button></div></form>';
    openSheet(html, sheet => {
      const f = sheet.querySelector('#fm');
      state.onSheetClose = () => res(null);
      f.addEventListener('submit', async ev => {
        ev.preventDefault();
        const v = readForm(f, fields);
        const err = opt.validate ? opt.validate(v) : '';
        if (err) { sheet.querySelector('#fm-err').textContent = err; return; }
        if (opt.save) { const ok = await opt.save(v); if (ok === false) return; }
        state.onSheetClose = null; closeSheet(); res(v);
      });
      sheet.querySelector('[data-x=cancel]').addEventListener('click', () => closeSheet());
    });
  });
}

/* ---------------- reports ---------------- */
function monthRange(d) { return {from: ymd(new Date(d.getFullYear(), d.getMonth(), 1)), to: ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0))}; }
function computeReport(from, to) {
  const rows = new Map(), busy = [];
  let cur = pd(from); const end = pd(to);
  for (let i = 0; i < 1200 && cur <= end; i++, cur = addD(cur, 1)) {
    const k = ymd(cur); if (!isWorking(k)) continue;
    for (const e of dayList(k)) {
      if (!rows.has(e.memberId)) rows.set(e.memberId, {counts: {}, total: 0});
      const r = rows.get(e.memberId); r.counts[e.typeId] = (r.counts[e.typeId] || 0) + 1;
    }
    let c = 0; perMember(k).forEach((v, mid) => { rows.get(mid).total += v; c += v; });
    if (c > 0) busy.push({k, c, p: peopleOn(k)});
  }
  busy.sort((a, b) => b.c - a.c || (a.k < b.k ? -1 : 1));
  return {rows, busy};
}
function reportsTab() {
  if (!state.rep) state.rep = monthRange(new Date());

    '<div class="row2"><label class="fld">From<input type="date" data-chg="rfrom" value="' + esc(from) + '"></label><label class="fld">To<input type="date" data-chg="rto" value="' + esc(to) + '"></label></div>';
  if (!valid) return h + '<p class="err">Choose a valid date range.</p></div>';

  h += '<p class="muted small">' + fmtRange(from, to) + ' · ' + workingDays(from, to) + ' working days' + (filtersOn() ? ' · calendar filters applied' : '') + '</p>';
  if (!ids.length) h += '<div class="card pad muted">No leave in this period.</div>';
  else {
    const tot = {}; let all = 0;
    h += '<div class="card tablewrap"><table><thead><tr><th>Person</th>' + types.map(t => '<th class="n"><span class="sw" style="--c:' + safeColor(t.color) + '"></span> ' + esc(t.name) + '</th>').join('') + '<th class="n">Days off</th></tr></thead><tbody>' +
      ids.map(id => { const r = rows.get(id); all += r.total; return '<tr><td>' + esc(memberById(id).name) + '</td>' + types.map(t => { const v = r.counts[t.id] || 0; tot[t.id] = (tot[t.id] || 0) + v; return '<td class="n">' + (v || '–') + '</td>'; }).join('') + '<td class="n"><b>' + fmtNum(r.total) + '</b></td></tr>'; }).join('') +
      '</tbody><tfoot><tr><td>Total</td>' + types.map(t => '<td class="n">' + (tot[t.id] || 0) + '</td>').join('') + '<td class="n">' + fmtNum(all) + '</td></tr></tfoot></table></div>' +
      '<p class="note">Type columns = number of working days marked. Days off = full-day equivalent (half days count ½).</p>';
    h += '<h3>Busiest days</h3><div class="card pad">' + busy.slice(0, 5).map(b => '<div class="kv"><span>' + fmtD(b.k) + '</span><span><b>' + fmtNum(b.c) + '</b> off</span></div>').join('') + '</div>';
  }
  h += '<div class="btns"><button class="btn" data-act="csv-sum">Export summary</button><button class="btn ghost" data-act="csv-ent">Export entries</button></div><p class="note">Exports open in Excel (CSV).</p></div>';
  return h;
}
function csvCell(v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
async function saveCsv(name, rows) {
  const s = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([s], {type: 'text/csv;charset=utf-8'});
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && navigator.canShare) {
    try { const file = new File([blob], name, {type: 'text/csv'}); if (navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function exportSummary() {
  const {from, to} = state.rep, types = state.data.types.filter(t => !state.filters.hidden.includes(t.id));
  const {rows} = computeReport(from, to);
  const out = [['Leave summary', fmtRange(from, to)], ['Person'].concat(types.map(t => t.name + ' (days marked)')).concat(['Days off (full-day equivalent)'])];
  Array.from(rows.keys()).sort((a, b) => memberById(a).name.localeCompare(memberById(b).name)).forEach(id => { const r = rows.get(id); out.push([memberById(id).name].concat(types.map(t => r.counts[t.id] || 0)).concat([r.total])); });
  saveCsv('Leave summary ' + from + ' to ' + to + '.csv', out);
}
function exportEntries() {
  const {from, to} = state.rep, f = state.filters;
  const list = state.data.entries.filter(e => e.start <= to && e.end >= from && (f.member === 'all' || e.memberId === f.member) && !f.hidden.includes(e.typeId) && memberById(e.memberId))
    .sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : memberById(a.memberId).name.localeCompare(memberById(b.memberId).name));
  const out = [['Person', 'Leave type', 'Half', 'From', 'To', 'Working days in period', 'Days off in period', 'Note']];
  list.forEach(e => { const a = e.start < from ? from : e.start, b = e.end > to ? to : e.end, wd = workingDays(a, b); out.push([memberById(e.memberId).name, (typeById(e.typeId) || {}).name || '', e.part || '', e.start, e.end, wd, wd * Math.min(1, weightOf(e)), e.note || '']); });
  saveCsv('Leave entries ' + from + ' to ' + to + '.csv', out);
}

async function addToken() {
  await formModal('Add admin edit key', [{key: 'tok', label: 'Edit key (GitHub token)', type: 'password', placeholder: 'github_pat_…'}], {
    ok: 'Check & save', note: 'Paste the edit key your tracker owner gave you. It is stored only on this phone.',
    validate: v => v.tok.length < 20 ? 'That does not look like a full key.' : '',
    save: async v => {
      setBusy(true);
      try {
        const r = await fetch(apiBase(), {headers: ghHeaders(v.tok), cache: 'no-store'});
        if (r.status === 401) { toast('That key is not valid or has expired.', 4000); return false; }
        if (!r.ok) { toast('That key cannot see ' + repoLabel() + '. Check it has access to this repository.', 5000); return false; }
        const j = await r.json();
        if (j.permissions && j.permissions.push === false) { toast('That key belongs to an account without write access to ' + repoLabel() + '.', 5000); return false; }
        state.token = v.tok; localStorage.setItem(K.token, v.tok); toast('Edit key saved – you can now make changes.'); render(); return true;
      } catch (e) { toast("Can't reach GitHub right now.", 4000); return false; }
      finally { setBusy(false); }
    }
  });
}

function parseHolidayLines(text) {
  const out = [], bad = [];
  text.split(/\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
    let m = line.match(/^(\d{4})-(\d{1,2})-(\d{1,2})\s*[,;\t|:\-–]?\s*(.+)$/), date;
    if (m) date = m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
    else { m = line.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\s*[,;\t|:\-–]?\s*(.+)$/); if (m) { date = m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]); m[4] = m[4]; } }
    if (m && isDate(date) && m[4].trim()) out.push({date, name: m[4].trim()}); else bad.push(line);
  });
  return {out, bad};
}

  });
  if (!v) return;

function renderLock(msg) {
  screen('<h1 class="brand">' + BRAND + '</h1><p class="muted tag-line small">Team leave, made easy</p><p class="muted">' + esc(msg || 'Enter the team passcode to open the calendar.') + '</p><form id="lockf" novalidate><input type="password" name="p" placeholder="Team passcode" autocomplete="current-password" autocapitalize="off" spellcheck="false"><p class="err" id="lerr"></p><button class="btn full" type="submit">Open</button></form>');
  const f = $('#lockf');

    ev.preventDefault();
    const p = f.p.value, err = $('#lerr'), b = f.querySelector('button');
    if (!p) { err.textContent = 'Enter the passcode.'; return; }
    b.disabled = true; b.textContent = 'Checking…'; err.textContent = '';
    try {
      let rem = state.pendingRemote;
      if (!rem) {
        try { rem = await fetchRemote(); }
        catch (e) { const c = localStorage.getItem(K.cache); if (c) rem = {env: JSON.parse(c), sha: null, cached: true}; else throw e; }
      }
      if (rem.notFound) return renderSetup();
      const d = await decryptData(rem.env, p);
      state.pass = p; localStorage.setItem(K.pass, p); state.pendingRemote = null;
      applyData(d, rem.env, rem.sha);
      if (rem.cached) { state.sync.status = 'offline'; updateSyncLabel(); }

  });

function renderSetup() {
  screen('<h1>Set up ' + BRAND + '</h1><p class="muted">No tracker data exists in <b>' + esc(repoLabel()) + '</b> yet. Create it now (owner only, one time).</p><form id="sf" novalidate>' +
    fieldHtml({key: 'team', label: 'Team name', value: 'Photo Editorial – Leave'}) +
    fieldHtml({key: 'people', label: 'Team members (one per line – you can change later)', type: 'textarea', placeholder: 'Jaydeep\nAsha\nRahul'}) +
    fieldHtml({key: 'p1', label: 'Choose a team passcode (8+ characters)', type: 'password'}) +
    fieldHtml({key: 'p2', label: 'Repeat the passcode', type: 'password'}) +
    fieldHtml({key: 'tok', label: 'Your admin edit key (GitHub token)', type: 'password', placeholder: 'github_pat_…', hint: 'See step 4 of the setup guide.'}) +
    '<p class="err" id="serr"></p><button class="btn full" type="submit">Create tracker</button></form>');
  $('#sf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = ev.target, err = $('#serr'), b = f.querySelector('button[type=submit]');
    const team = f.team.value.trim(), people = f.people.value.split(/\n/).map(s => s.trim()).filter(Boolean), p1 = f.p1.value, p2 = f.p2.value, tok = f.tok.value.trim();
    if (!team) { err.textContent = 'Enter a team name.'; return; }
    if (p1.length < 8) { err.textContent = 'Use a passcode of at least 8 characters.'; return; }
    if (p1 !== p2) { err.textContent = 'The passcodes do not match.'; return; }
    if (tok.length < 20) { err.textContent = 'Paste your admin edit key.'; return; }
    b.disabled = true; b.textContent = 'Creating…'; err.textContent = '';
    const prevTok = state.token; state.token = tok;
    try {
      const r = await fetch(apiBase(), {headers: ghHeaders(tok), cache: 'no-store'});
      if (r.status === 401) throw new Error('The edit key is not valid or has expired.');
      if (!r.ok) throw new Error('The edit key cannot see ' + repoLabel() + '. Check the repository name and the key\'s access.');
      const d = starterData(team, people);
      const env = await encryptData(d, p1);
      let sha;
      try { sha = await putRemote(env, null, 'Create leave tracker data'); }
      catch (e) { if (e.code === 'conflict') throw new Error('A tracker already exists here. Reload the page to open it.'); throw e; }
      localStorage.setItem(K.token, tok); localStorage.setItem(K.pass, p1); state.pass = p1;
      state.tab = 'set'; applyData(d, env, sha); toast('Tracker created! Check the team list and holidays.', 4000);
    } catch (e) { state.token = prevTok; err.textContent = e.message; b.disabled = false; b.textContent = 'Create tracker'; }
  });
}

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal-root').classList.contains('open') && !$('#dialog-root').classList.contains('open')) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.data && state.pass && Date.now() - (state.sync.at || 0) > 60000 && !state.busy) sync(false); });
window.addEventListener('online', () => { if (state.data && state.pass) sync(false); });

/* ---------------- start ---------------- */
async function boot() {
  state.repo = detectRepo();
  state.token = localStorage.getItem(K.token) || '';
  state.pass = localStorage.getItem(K.pass) || '';
  state.data = null; state.pendingRemote = null;
  if (!window.crypto || !crypto.subtle) { screen('<h1>Open the secure link</h1><p class="muted">This app must be opened from its https:// address.</p>'); return; }
  if (!state.repo) return renderConnect();
  if (!state.pass) {
    renderLoading();
    try { const rem = await fetchRemote(); if (rem.notFound) return renderSetup(); state.pendingRemote = rem; }
    catch (e) { if (!localStorage.getItem(K.cache)) { state.sync.msg = e.message; return renderOffline(); } }
    return renderLock();
  }
  const c = localStorage.getItem(K.cache);
  if (c) {
    try { const d = await decryptData(JSON.parse(c), state.pass); state.data = d; state.sync = {status: 'syncing', at: 0, msg: ''}; rebuildIndex(); render(); }
    catch (e) { if (e.code === 'badpass') { forgetPass(); return renderLock(); } }
  } else renderLoading();
  await sync(false);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
boot();

<script>document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,.btn,.mcell,.wrow');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height);const cs=getComputedStyle(b);if(cs.position==='static')b.style.position='relative';b.style.overflow='hidden';const d=document.createElement('span');d.className='rip';d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';b.appendChild(d);setTimeout(()=>d.remove(),650);},{passive:true});
new MutationObserver(()=>document.querySelectorAll('.mgrid .mcell:not([style*="--i"])').forEach((c,i)=>c.style.setProperty('--i',i))).observe(document.documentElement,{childList:true,subtree:true});
</script>
